name: Portable build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: SDL on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: SDL on macOS
        if: runner.os == 'macOS'
        run: brew install sdl2
      - name: SDL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-VC.zip -OutFile SDL2.zip
          Expand-Archive SDL2.zip -DestinationPath "$env:RUNNER_TEMP/SDL2"
          "SDL2_DIR=$env:RUNNER_TEMP/SDL2/SDL2-2.32.10/cmake" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SDL
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        env:
          CC: clang
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DLQ_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure without SDL
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLQ_BUILD_CLIENT=OFF
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
  gpu-vulkan:
    # Compile the shared GPU path and exercise it with Mesa's software Vulkan
    # device. This does not establish performance on a physical Linux GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers xvfb
      - name: SDL3
        run: |
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL3"
          test "$(git -C "$RUNNER_TEMP/SDL3" rev-parse HEAD)" = 829a65d769d935c4852f8159e964312c0957260a
          cmake -S "$RUNNER_TEMP/SDL3" -B "$RUNNER_TEMP/sdl-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl-prefix" -DSDL_TESTS=OFF
          cmake --build "$RUNNER_TEMP/sdl-build" --parallel
          cmake --install "$RUNNER_TEMP/sdl-build"
      - name: Configure and build
        run: |
          cmake -S . -B build-gpu -DCMAKE_BUILD_TYPE=Release -DLQ_BUILD_GPU=ON -DLQ_GPU_TESTS=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl-prefix"
          cmake --build build-gpu --parallel
      - name: Test
        env:
          SDL_GPU_DRIVER: vulkan
        run: xvfb-run -a ctest --test-dir build-gpu --output-on-failure
